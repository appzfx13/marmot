

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Marmot Algorithmic Trading</title>

    <!-- SEO Optimization -->
    <meta name="description" content="Sign In to Marmot Algorithmic Trading & Analytics Dashboard">
    <meta name="author" content="Marmot Core">

    <!-- Favicon -->
    
    <link rel="icon" href="/media/site/logos/1c9a19c6.png">
    <link rel="shortcut icon" href="/media/site/logos/1c9a19c6.png">
    

    <!-- Third-Party Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Main Design System & Custom Stylesheet -->
    <link rel="stylesheet" href="/static/css/spark-theme.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>html { font-size: 90%; }</style>
</head>
<body>

    <!-- ==========================================
         Theme Toggle Button (Top Right Corner)
         ========================================== -->
    <div class="theme-toggle-corner">
        <button type="button" 
                class="btn btn-sm rounded-pill d-inline-flex align-items-center gap-2 px-3 py-1.5 shadow-sm" 
                id="themeToggleBtn" 
                title="Toggle Theme" 
                style="background: var(--card-background); border: 1px solid var(--border-color); color: var(--text-main);">
            <i class="bi bi-moon-stars-fill" id="themeIcon" style="color: var(--brand-lime);"></i>
            <span class="small fw-semibold" id="themeText">Dark</span>
        </button>
    </div>

    <!-- ==========================================
         Authentication Container & Login Card
         ========================================== -->
    <div class="login-wrapper min-vh-100 d-flex flex-column align-items-center justify-content-center py-2">
        <!-- Glowing background shapes for modern visual appearance -->
        <div class="login-bg-shape login-bg-shape-1"></div>
        <div class="login-bg-shape login-bg-shape-2"></div>
        
        <!-- Main centered login card -->
        <div class="login-card">
            
            <!-- Brand Identity -->
            <a href="/" class="login-brand text-decoration-none">
                
                    <img src="/media/site/logos/100462fe.png" alt="Marmot" class="dark-logo" style="max-height: 36px; width: auto; object-fit: contain;">
                    <img src="/media/site/logos/d0f4fc9b.png" alt="Marmot" class="light-logo d-none" style="max-height: 36px; width: auto; object-fit: contain;">
                
                <span>MARMOT</span>
            </a>
            
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-subtitle">Please sign in to access your trading dashboard</p>
            
            

            <!-- Login Form -->
            <form action="/users/login/" method="POST" id="loginForm" class="needs-validation" novalidate>
                <input type="hidden" name="csrfmiddlewaretoken" value="ivTz9jzUsTAbEto1XyXjPjGwll0bzEmey1HZLWotptvegbUhQnLqf9UpXyxkhHOo">
                
                <!-- Username / Email Input Group -->
                <div class="login-form-group">
                    <label for="id_username" class="login-form-label">Username or Email</label>
                    <div class="login-input-group">
                        <i class="bi bi-person input-icon"></i>
                        <input type="text" 
                               name="username" 
                               id="id_username" 
                               class="login-input" 
                               placeholder="trader@marmot.io" 
                               required 
                               autofocus 
                               autocomplete="username">
                    </div>
                </div>
                
                <!-- Password Input Group -->
                <div class="login-form-group">
                    <label for="id_password" class="login-form-label">Password</label>
                    <div class="login-input-group">
                        <i class="bi bi-shield-lock input-icon"></i>
                        <input type="password" 
                               name="password" 
                               id="id_password" 
                               class="login-input login-input-password" 
                               placeholder="••••••••" 
                               required 
                               autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Show password" onclick="togglePasswordVisibility()">
                            <i class="bi bi-eye" id="passwordToggleIcon"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Options (Remember me & Forgot Password) -->
                <div class="login-options">
                    <label class="custom-control-label">
                        <input type="checkbox" class="custom-checkbox-input" id="rememberMe" name="remember_me">
                        <span>Remember Me</span>
                    </label>
                    <a href="/users/reset-password/" class="forgot-password-link">Forgot Password?</a>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="btn-login" id="btn-submit">
                    <span>Sign In to Dashboard</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
                
            </form>
            
            <!-- Divider -->
            <div class="login-divider">Or sign in with</div>
            
            <!-- Social Logins -->
            <div class="social-login-grid" style="grid-template-columns: 1fr;">
                <a href="/accounts/google/login/?next=%2Fadmins%2Fdashboard%2Flive%2Foption-chain%2F%3Fenv%3DMOCK" class="btn-social" id="btn-google">
                    <i class="bi bi-google text-danger"></i>
                    <span>Continue with Google</span>
                </a>
            </div>
            
            <!-- Footer Link -->
            <p class="login-footer-text">
                Don't have an account? <a href="/users/signup/" id="link-register">Register Now</a>
            </p>
            
        </div>
    </div>
    <!-- END: Authentication Container -->

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Theme & Password Toggle Interactions -->
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('id_password');
            const icon = document.getElementById('passwordToggleIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                passwordInput.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        (function() {
            const savedTheme = localStorage.getItem('marmot_theme') || localStorage.getItem('theme') || localStorage.getItem('marmot-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeUI(savedTheme);

            const toggleBtn = document.getElementById('themeToggleBtn');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('marmot_theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                    localStorage.setItem('marmot-theme', newTheme);
                    updateThemeUI(newTheme);
                });
            }

            function updateThemeUI(theme) {
                const icon = document.getElementById('themeIcon');
                const text = document.getElementById('themeText');
                if (theme === 'dark') {
                    if (icon) icon.className = 'bi bi-moon-stars-fill';
                    if (text) text.textContent = 'Dark';
                } else {
                    if (icon) icon.className = 'bi bi-sun-fill';
                    if (text) text.textContent = 'Light';
                }
            }
        })();
    </script>
</body>
</html>
