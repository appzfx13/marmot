services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # --- Redis Service ---
  redis_broker:
    image: redis:7-alpine
    container_name: redis_broker
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  # --- Adminer Database UI ---
  adminer:
    image: adminer:latest
    container_name: adminer_ui
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - app_network

  # --- Django Web App ---
  web:
    build: .
    container_name: django_app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8005:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    env_file:
      - .env
    environment:
      # DB_* variables read directly from .env file
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_HOST=db
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
    networks:
      - app_network

  # --- Go Worker Service ---
  go_app:
    build:
      context: ./go-app
      dockerfile: Dockerfile
    container_name: go_service
    command: go run main.go
    ports:
      - "${WS_PORT}:${WS_PORT}"
    volumes:
      - ./go-app:/app
      - ./backup:/app/backup
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      # DB_* variables read directly from .env file
      - POSTGRES_HOST=db
      - DB_TABLE_NAME=${DB_TABLE_NAME}
    depends_on:
      db:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
    networks:
      - app_network

  # --- Ngrok Tunnel Container ---
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok_tunnel
    restart: always
    command:
      - "http"
      - "web:8000"
      - "--authtoken=${NGROK_AUTHTOKEN}"
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - web
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:
  static_volume:

networks:
  app_network:
    driver: bridge
