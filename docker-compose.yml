services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    ports:
      - "8052:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # --- Redis Service ---
  redis_broker:
    image: redis:7-alpine
    container_name: redis_broker
    restart: always
    ports:
      - "8051:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network



  # --- Django Web App ---
  web:
    build: .
    container_name: django_app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8050:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    env_file:
      - .env
    environment:
      # DB_* variables read directly from .env file
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_HOST=db
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
    networks:
      - app_network

  # --- Django Webhook Async Worker ---
  webhook_worker:
    build: .
    container_name: django_webhook_worker
    command: python manage.py run_webhook_worker
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
    networks:
      - app_network

  # --- Go Worker Service ---
  go_app:
    build:
      context: ./go-app
      dockerfile: Dockerfile
    container_name: go_service
    command: go run main.go
    ports:
      - "${WS_PORT}:${WS_PORT}"
    volumes:
      - ./go-app:/app
      - ./backup:/app/backup
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      # DB_* variables read directly from .env file
      - POSTGRES_HOST=db
      - DB_TABLE_NAME=${DB_TABLE_NAME}
    depends_on:
      db:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
    networks:
      - app_network

  # --- Nginx Reverse Proxy Gateway ---
  nginx_proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - go_app
    networks:
      - app_network

  # --- Ngrok Tunnel Container ---
  ngrok_tunnel:
    image: ngrok/ngrok:latest
    container_name: ngrok_tunnel
    restart: always
    command: http nginx_proxy:80
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - nginx_proxy
    networks:
      - app_network

  # --- Dhan Broker Gateway Emulator ---
  mock_broker:
    build:
      context: ./dhan-emulator
      dockerfile: Dockerfile
    container_name: dhan_mock_broker
    restart: always
    ports:
      - "8088:8088"
    volumes:
      - ./dhan-emulator/templates:/app/templates
      - ./backup:/app/backup:ro
    env_file:
      - .env
    environment:
      - PORT=8088
      - REDIS_HOST=redis_broker
      - REDIS_PORT=6379
      - MARMOT_POSTBACK_URL=http://django_app:8000/api/mock/dhan/postback/
      - PARQUET_DIR=/app/backup
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:
  static_volume:

networks:
  app_network:
    driver: bridge
