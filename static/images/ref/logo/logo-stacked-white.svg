<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Marmot">
  <defs>
    <linearGradient id="shieldSt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7a5af8"/>
    </linearGradient>
    <linearGradient id="bodySt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b4b"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cyanSt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a2e4e4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glowSt" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowSt" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#7a5af8" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="underlineSt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7a5af8"/>
    </linearGradient>
  </defs>

  <!-- ═══ SHIELD ICON (centered, large) ═══ -->
  <g filter="url(#shadowSt)" transform="translate(20, 4) scale(4.4)">
    <path d="M18 2 L34 7 L34 21 C34 30 18 38 18 38 C18 38 2 30 2 21 L2 7 Z"
          fill="url(#shieldSt)" stroke="#7a5af8" stroke-width="0.5"/>
    <path d="M18 2 L34 7 L34 21 C34 30 18 38 18 38 C18 38 2 30 2 21 L2 7 Z"
          fill="url(#glowSt)"/>
    <polygon points="10,30 12,20 16,16 20,18 22,24 20,30" fill="url(#bodySt)"/>
    <polygon points="12,20 16,16 18,13 20,18 16,19" fill="#1e3a8a"/>
    <polygon points="16,10 20,8 23,11 22,16 18,13 16,13" fill="#0d1b4b" stroke="#1e3a8a" stroke-width="0.3"/>
    <polygon points="20,8 23,11 22,13 19,10" fill="#1e40af"/>
    <polygon points="22,11 25,9 26,13 23,14" fill="url(#cyanSt)" opacity="0.9"/>
    <polygon points="16,13 18,13 17,16 14,15" fill="#1e3a8a"/>
    <circle cx="21" cy="10" r="0.9" fill="#ffffff"/>
    <circle cx="21" cy="10" r="0.5" fill="#a2e4e4"/>
    <line x1="12" y1="20" x2="16" y2="16" stroke="#3b82f6" stroke-width="0.6" opacity="0.7"/>
    <line x1="16" y1="16" x2="20" y2="18" stroke="#7a5af8" stroke-width="0.6" opacity="0.6"/>
    <line x1="20" y1="18" x2="22" y2="24" stroke="#3b82f6" stroke-width="0.5" opacity="0.5"/>
    <polygon points="10,30 12,25 14,28 13,32" fill="#0d1b4b"/>
    <polygon points="20,30 22,25 24,28 22,32" fill="#0d1b4b"/>
    <path d="M18 4.5 L31.5 8.5 L31.5 21 C31.5 28.5 18 35.5 18 35.5 C18 35.5 4.5 28.5 4.5 21 L4.5 8.5 Z"
          fill="none" stroke="#3b82f6" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- ═══ Text: MARMOT below icon ═══ -->
  <text x="60" y="108"
        font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif"
        font-size="18"
        font-weight="800"
        letter-spacing="2"
        text-anchor="middle"
        fill="#f8fafc">MARMOT</text>

  <!-- gradient underline centered -->
  <rect x="20" y="112" width="80" height="2" rx="1" fill="url(#underlineSt)" opacity="0.85"/>
</svg>
