<!-- templates/admins/partials/backtest_adopt_rule_success.html -->
<div class="p-3 rounded-3 border d-flex align-items-center justify-content-between gap-3 mt-2" 
     style="background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.45) !important;">
    <div class="d-flex align-items-center gap-2.5">
        <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" 
             style="width: 34px; height: 34px; background: rgba(16, 185, 129, 0.25); color: #34d399;">
            <span class="material-icons" style="font-size: 1.15rem;">task_alt</span>
        </div>
        <div>
            <div class="fw-bold text-success font-monospace" style="font-size: 0.80rem;">
                Rule Successfully Adopted & Saved!
            </div>
            <div class="text-light small mt-0.5" style="font-size: 0.74rem;">
                <span class="fw-bold">{{ rule.name }}</span> (ID: #{{ rule.pk }}) is now active in your strategy rulebook.
            </div>
        </div>
    </div>
    <span class="badge rounded-pill bg-success px-3 py-1 font-monospace fw-bold" style="font-size: 0.72rem;">
        ACTIVE IN STRATEGY
    </span>
</div>
