{% load static %}
<div class="d-flex flex-column gap-4">

    <!-- START: Spark Page Header -->
    <div class="page-header d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
        <div>
            <h1 class="page-title">{{ page_title }}</h1>
            <p class="page-subtitle">Configure, execute, and analyze plug-and-play intraday option backtests and quantitative simulations.</p>
        </div>
        
        <div class="page-header-actions d-flex align-items-center gap-2 flex-wrap">
            <div class="dropdown bulk-dropdown d-none">
                <button class="btn btn-outline-danger rounded-pill px-3 py-1.5 fw-semibold dropdown-toggle d-inline-flex align-items-center gap-2 shadow-sm" 
                        type="button" 
                        data-bs-toggle="dropdown" 
                        aria-expanded="false"
                        title="Bulk Operations">
                    <i class="bi bi-three-dots-vertical"></i>
                    <span>Bulk Actions</span>
                    <span class="badge bg-danger rounded-pill bulk-selected-count">0</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end dropdown-menu-custom">
                    <li>
                        <a class="dropdown-item text-danger d-flex align-items-center gap-2" 
                           href="javascript:void(0);" 
                           onclick="triggerBulkDelete(this, '{% url 'backtest:backtest_bulk_delete' %}')">
                            <i class="bi bi-trash"></i>
                            <span>Delete Selected (<span class="bulk-selected-count">0</span>)</span>
                        </a>
                    </li>
                </ul>
            </div>

            <a href="{% url 'backtest:rule_list' %}" class="btn btn-outline-secondary rounded-pill fw-semibold d-inline-flex align-items-center justify-content-center gap-2 px-3 py-1.5 shadow-sm" title="Manage Execution Rules & Directives">
                <i class="bi bi-card-checklist"></i>
                <span>Strategy Rules</span>
            </a>

            <a href="{% url 'backtest:backtest_create' %}" class="btn btn-primary rounded-pill fw-semibold text-white d-inline-flex align-items-center justify-content-center gap-2 px-4 py-2 shadow-sm">
                <i class="bi bi-play-circle-fill"></i>
                <span>Run New Backtest</span>
            </a>
        </div>
    </div>
    <!-- END: Spark Page Header -->

    <!-- Search & Filter Controls -->
    <div class="card mb-0">
        <div class="card-body p-3 p-md-4">
            <form method="GET" action="{{ request.path }}" class="row g-3 align-items-center">
                
                <div class="col-12 col-sm-6 col-lg-4">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 theme-text-muted border-secondary border-opacity-25">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" 
                               name="q" 
                               value="{{ request.GET.q }}" 
                               class="form-control bg-transparent border-start-0 theme-text-main border-secondary border-opacity-25" 
                               placeholder="Search strategy or ID..."
                               hx-get="{{ request.path }}"
                               hx-target="#backtest-dashboard-container"
                               hx-trigger="input changed delay:400ms, search"
                               hx-include="[name='status']"
                               hx-push-url="true">
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-lg-3">
                    <select name="status" 
                            class="form-select bg-transparent theme-text-main border-secondary border-opacity-25"
                            hx-get="{{ request.path }}"
                            hx-target="#backtest-dashboard-container"
                            hx-trigger="change"
                            hx-include="[name='q']"
                            hx-push-url="true">
                        <option value="" class="text-dark">All Statuses</option>
                        <option value="created" class="text-dark" {% if request.GET.status == 'created' %}selected{% endif %}>Created</option>
                        <option value="running" class="text-dark" {% if request.GET.status == 'running' %}selected{% endif %}>Running</option>
                        <option value="completed" class="text-dark" {% if request.GET.status == 'completed' %}selected{% endif %}>Completed</option>
                        <option value="error" class="text-dark" {% if request.GET.status == 'error' %}selected{% endif %}>Error</option>
                    </select>
                </div>

                <div class="col-12 col-sm-6 col-lg-3 ms-auto">
                    <a href="{{ request.path }}" 
                       class="btn btn-outline-secondary rounded-pill theme-text-muted border-secondary border-opacity-25 w-100 d-inline-flex align-items-center justify-content-center gap-1.5"
                       hx-get="{{ request.path }}"
                       hx-target="#backtest-dashboard-container"
                       hx-push-url="true">
                        <i class="bi bi-arrow-counterclockwise"></i>
                        <span>Reset</span>
                    </a>
                </div>

            </form>
        </div>
    </div>

    <!-- HTMX Container -->
    <div id="backtest-dashboard-container" class="w-100"
         hx-get="{{ request.get_full_path }}" 
         hx-trigger="reloadBacktestTable from:body" 
         hx-target="#backtest-dashboard-container"
         hx-swap="innerHTML">
        {% include 'admins/partials/backtest_dashboard_content.html' %}
    </div>

</div>
