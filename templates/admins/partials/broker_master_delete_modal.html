<!-- templates/admins/partials/broker_master_delete_modal.html -->
<div class="modal-content glass-card p-2 border-0 shadow-lg" style="background: var(--nav-hover, rgba(20,20,25,0.95)); backdrop-filter: blur(16px); border: 1px solid var(--border-color, rgba(255,255,255,0.15)) !important;">
    <div class="modal-header border-0 pb-0">
        <div class="d-flex align-items-center gap-2 text-danger">
            <span class="material-icons fs-4">warning</span>
            <h5 class="modal-title fw-bold theme-text-main">Confirm Broker Deletion</h5>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <form hx-post="{% url 'admins:broker-master-delete' broker.pk %}" hx-swap="none">
        {% csrf_token %}
        <div class="modal-body py-3">
            <p class="theme-text-main mb-2">Are you sure you want to delete master broker <strong>"{{ broker.name }}"</strong> (<code>{{ broker.code }}</code>)?</p>
            <div class="alert alert-warning bg-warning bg-opacity-10 border-warning border-opacity-25 theme-text-main p-2 small mb-0 rounded-3">
                This action perform a soft-delete and disable trader connections using this broker.
            </div>
        </div>

        <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-sm btn-danger rounded-pill px-4 fw-bold d-inline-flex align-items-center gap-1 shadow-sm">
                <span class="material-icons fs-6">delete</span>Confirm Delete
            </button>
        </div>
    </form>
</div>
