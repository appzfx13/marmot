{% load static %}
<div class="d-flex flex-column gap-4">

    <!-- START: Spark Page Header -->
    <div class="page-header d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
        <div>
            <h1 class="page-title">{{ page_title }}</h1>
            <p class="page-subtitle">Manage, monitor, and execute automated market data backups and date-partitioned Parquet datasets.</p>
        </div>
        
        <div class="page-header-actions d-flex align-items-center gap-2 flex-wrap">
            <div class="dropdown bulk-dropdown d-none">
                <button class="btn btn-outline-danger rounded-pill px-3 py-1.5 fw-semibold dropdown-toggle d-inline-flex align-items-center gap-2 shadow-sm" 
                        type="button" 
                        data-bs-toggle="dropdown" 
                        aria-expanded="false"
                        title="Bulk Operations">
                    <i class="bi bi-three-dots-vertical"></i>
                    <span>Bulk Actions</span>
                    <span class="badge bg-danger rounded-pill bulk-selected-count">0</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end dropdown-menu-custom">
                    <li>
                        <a class="dropdown-item text-danger d-flex align-items-center gap-2" 
                           href="javascript:void(0);" 
                           onclick="triggerBulkDelete(this, '{% url 'market:market_backup_bulk_delete' %}')">
                            <i class="bi bi-trash"></i>
                            <span>Delete Selected (<span class="bulk-selected-count">0</span>)</span>
                        </a>
                    </li>
                </ul>
            </div>

            <a href="{% url 'trade_core:dhan-admin-login' %}" class="btn btn-outline-secondary rounded-pill fw-semibold d-inline-flex align-items-center justify-content-center gap-2 px-3 py-1.5 shadow-sm" title="Authenticate with DhanHQ to generate 24h master token for market data backup">
                <i class="bi bi-key-fill"></i>
                <span>Auth DhanHQ</span>
            </a>

            <a href="{% url 'market:market_backup_create' %}" class="btn btn-primary rounded-pill fw-semibold text-white d-inline-flex align-items-center justify-content-center gap-2 px-4 py-2 shadow-sm">
                <i class="bi bi-cloud-arrow-up-fill"></i>
                <span>Run Backup Now</span>
            </a>
        </div>
    </div>
    <!-- END: Spark Page Header -->

    <!-- Search & Filter Controls -->
    <div class="card card-filter mb-0">
        <div class="card-body p-2 px-3">
            <form method="GET" action="{{ request.path }}" class="row g-2 align-items-center">
                
                <!-- Search by Backup Name or Query -->
                <div class="col-12 col-sm-6 col-lg-4">
                    <div class="filter-search-wrapper">
                        <input type="text" 
                               name="q" 
                               value="{{ request.GET.q|default:'' }}" 
                               class="form-control" 
                               placeholder="Search backups..."
                               hx-get="{{ request.path }}"
                               hx-target="#backup-dashboard-container"
                               hx-trigger="input changed delay:400ms, search"
                               hx-include="[name='status']"
                               hx-push-url="true">
                        <span class="search-icon">
                            <i class="bi bi-search"></i>
                        </span>
                    </div>
                </div>

                <!-- Filter by Status -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <select name="status" 
                            class="form-select bg-transparent theme-text-main border-secondary border-opacity-25"
                            hx-get="{{ request.path }}"
                            hx-target="#backup-dashboard-container"
                            hx-trigger="change"
                            hx-include="[name='q']"
                            hx-push-url="true">
                        <option value="">All Statuses</option>
                        <option value="completed" {% if request.GET.status == 'completed' %}selected{% endif %}>Completed</option>
                        <option value="in_progress" {% if request.GET.status == 'in_progress' %}selected{% endif %}>In Progress</option>
                        <option value="failed" {% if request.GET.status == 'failed' %}selected{% endif %}>Failed</option>
                    </select>
                </div>

                <!-- Reset Button -->
                <div class="col-12 col-sm-6 col-lg-3 ms-auto">
                    <a href="{{ request.path }}" 
                       class="btn btn-outline-secondary rounded-pill theme-text-muted border-secondary border-opacity-25 w-100 d-inline-flex align-items-center justify-content-center gap-1.5"
                       hx-get="{{ request.path }}"
                       hx-target="#backup-dashboard-container"
                       hx-push-url="true">
                        <i class="bi bi-arrow-counterclockwise"></i>
                        <span>Reset</span>
                    </a>
                </div>

            </form>
        </div>
    </div>

    <!-- FIXED CONTAINER: HTMX target container that holds the table partial -->
    <div id="backup-dashboard-container" class="w-100"
         hx-get="{{ request.get_full_path }}" 
         hx-trigger="reloadBackupTable from:body" 
         hx-target="#backup-dashboard-container"
         hx-swap="innerHTML">
        {% include 'admins/partials/backup_dashboard_content.html' %}
    </div>

</div>
