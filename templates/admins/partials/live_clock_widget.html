{% load static %}
<!-- Live Exchange Clock HUD Widget (IST Real-Time Exchange Session Time) -->
<div class="glass-card p-3 rounded-4 border border-white border-opacity-10 d-flex align-items-center justify-content-between gap-3 shadow-sm"
     style="background: rgba(255, 255, 255, 0.03);">
    <div class="d-flex align-items-center gap-3">
        <div class="rounded-circle bg-primary bg-opacity-15 text-primary d-flex align-items-center justify-content-center flex-shrink-0" style="width: 44px; height: 44px;">
            <i class="bi bi-clock-history fs-4 text-warning"></i>
        </div>
        <div>
            <div class="d-flex align-items-center gap-2 mb-0.5">
                <span class="fw-bold fs-4 font-monospace theme-text-main" id="live-exchange-clock-time">
                    {{ market_clock.time_str|default:"09:15:00" }}
                </span>
                <span class="badge bg-dark bg-opacity-75 text-white-50 font-monospace smaller px-2 py-0.5 border border-white border-opacity-10">IST</span>
                <span class="badge bg-warning bg-opacity-20 text-warning border border-warning border-opacity-30 rounded-pill px-2 py-0.5 font-monospace fw-bold" id="live-replay-speed-badge" style="display: none;">
                    <i class="bi bi-speedometer2 me-1"></i><span id="live-replay-speed-val">1</span>x
                </span>
            </div>
            <div class="theme-text-muted smaller d-flex align-items-center gap-2">
                <span id="live-exchange-clock-date">{{ market_clock.date_str }}</span>
                <span>&bull;</span>
                <span id="live-exchange-clock-zone">NSE/BSE Exchange Zone</span>
            </div>
        </div>
    </div>
    <div class="text-end">
        <span class="badge {{ market_clock.badge_class }} rounded-pill px-3 py-1.5 fw-bold d-inline-flex align-items-center gap-1.5" id="live-exchange-clock-status">
            {% if market_clock.is_open %}
                <span class="spinner-grow spinner-grow-sm text-success" role="status" style="width: 0.45rem; height: 0.45rem;"></span>
            {% else %}
                <i class="bi bi-moon-stars-fill me-1"></i>
            {% endif %}
            <span>{{ market_clock.label }}</span>
        </span>
        <div class="theme-text-muted smaller mt-1 font-monospace">Square-off: 15:15 IST</div>
        <div class="theme-text-muted smaller mt-1 font-monospace" id="engine-latency-indicator" style="display:none;">
            <i class="bi bi-activity text-success"></i> <span id="latency-ms-val" class="text-success fw-bold">0</span><span class="opacity-75">ms tick</span>
        </div>
    </div>
</div>

<script>
    (function() {
        window._isVirtualClock = false;
        function updateLiveClock() {
            if (window._isVirtualClock) return; // Preserve historical replay clock
            const timeElem = document.getElementById('live-exchange-clock-time');
            if (!timeElem) return;
            const now = new Date();
            // Calculate IST time (UTC + 5:30)
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const istTime = new Date(utc + (3600000 * 5.5));
            const hours = String(istTime.getHours()).padStart(2, '0');
            const minutes = String(istTime.getMinutes()).padStart(2, '0');
            const seconds = String(istTime.getSeconds()).padStart(2, '0');
            timeElem.textContent = `${hours}:${minutes}:${seconds}`;
        }
        if (window._liveClockInterval) clearInterval(window._liveClockInterval);
        window._liveClockInterval = setInterval(updateLiveClock, 1000);

        // Bind directly to historical Parquet / Virtual Clock stream
        window.addEventListener('marmot:virtual_clock', function(e) {
            window._isVirtualClock = true;
            const data = e.detail;
            if (!data) return;
            const timeElem = document.getElementById('live-exchange-clock-time');
            const dateElem = document.getElementById('live-exchange-clock-date');
            const statusElem = document.getElementById('live-exchange-clock-status');
            const zoneElem = document.getElementById('live-exchange-clock-zone');

            if (timeElem && data.time) {
                timeElem.textContent = data.time;
            }
            if (dateElem && data.date) {
                dateElem.textContent = data.date;
            }
            if (zoneElem) {
                zoneElem.textContent = 'Historical Parquet Feed';
            }
            if (data.speed) {
                const spdElem = document.getElementById('live-replay-speed-val');
                const spdBadge = document.getElementById('live-replay-speed-badge');
                if (spdElem) spdElem.textContent = data.speed;
                if (spdBadge) spdBadge.style.display = 'inline-flex';
            }
            if (statusElem && !statusElem.classList.contains('virtual-clock-active')) {
                statusElem.className = 'badge bg-info bg-opacity-20 text-info border border-info border-opacity-30 rounded-pill px-3 py-1.5 fw-bold d-inline-flex align-items-center gap-1.5 virtual-clock-active';
                statusElem.innerHTML = '<span class="spinner-grow spinner-grow-sm text-info" role="status" style="width: 0.45rem; height: 0.45rem;"></span><span>REPLAY CLOCK</span>';
            }
        });
    })();
</script>
