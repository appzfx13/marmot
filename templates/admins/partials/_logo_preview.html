{% load static %}
<div id="preview-container-{{ field_name }}" class="relative group rounded-xl p-4 bg-[#051C12]/60 border border-[#B4F105]/20 flex flex-col items-center justify-center transition-all duration-300 hover:border-[#B4F105]/50">
    {% if image_url %}
        <div class="relative w-full h-32 flex items-center justify-center bg-[#04140D] rounded-lg p-2 overflow-hidden border border-white/5">
            <img src="{{ image_url }}" alt="{{ field_name }}" class="max-h-full max-w-full object-contain filter drop-shadow-md">
        </div>
        <div class="mt-3 text-center">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-[#B4F105]/15 text-[#B4F105] border border-[#B4F105]/30">
                <span class="w-1.5 h-1.5 rounded-full bg-[#B4F105] animate-pulse"></span>
                Active Asset
            </span>
            <p class="text-[11px] text-slate-400 mt-1 font-mono truncate max-w-[200px]">{{ image_url }}</p>
        </div>
    {% else %}
        <div class="w-full h-32 flex flex-col items-center justify-center bg-[#04140D] rounded-lg border border-dashed border-slate-700 text-slate-500">
            <svg class="w-8 h-8 opacity-40 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            <span class="text-xs">No asset uploaded</span>
        </div>
    {% endif %}
</div>
