<!-- admins/templates/admins/partials/confirm_delete.html -->
<div class="modal-content glass-card p-2" style="max-width: 520px; width: 100%; margin: 0 auto; border-radius: 16px;">
    <div class="modal-header border-0">
        <h5 class="modal-title theme-text-main">Confirm Deletion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body theme-text-muted">
        Are you sure you want to delete <strong>{{ object }}</strong>? This action cannot be undone.
    </div>

    <div class="modal-footer border-0">
        <button type="button" class="btn btn-outline-light rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>

        <!-- UPDATED: Removed hx-target, added hx-swap="none" -->
        <button type="button" hx-post="{{ request.path }}" hx-swap="none"
            class="btn btn-danger rounded-pill px-4 fw-bold">
            Confirm Delete
        </button>
    </div>
</div>
