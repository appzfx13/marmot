<!-- templates/admins/partials/confirm_delete.html -->
<div class="modal-content glass-card p-3 border-0 shadow-lg" style="max-width: 520px; width: 100%; margin: 0 auto; border-radius: 16px; background: var(--nav-hover, rgba(15,23,42,0.95)); backdrop-filter: blur(20px); border: 1px solid var(--border-color, rgba(255,255,255,0.15)) !important;">
    <div class="modal-header border-0 pb-1">
        <div class="d-flex align-items-center gap-2.5 text-danger">
            <div class="rounded-circle p-1.5 d-flex align-items-center justify-content-center" style="background: rgba(239, 68, 68, 0.15); width: 36px; height: 36px;">
                <i class="bi bi-exclamation-triangle-fill fs-5 text-danger"></i>
            </div>
            <h5 class="modal-title fw-bold theme-text-main mb-0">Confirm {{ item_name|default:"Deletion" }}</h5>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <form method="POST" action="{% if delete_url %}{{ delete_url }}{% else %}{{ request.get_full_path }}{% endif %}" 
          hx-post="{% if delete_url %}{{ delete_url }}{% else %}{{ request.get_full_path }}{% endif %}" 
          hx-swap="none"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
        {% csrf_token %}
        <div class="modal-body py-3">
            <p class="theme-text-main mb-2">Are you sure you want to delete <strong>{{ object }}</strong>?</p>
            <div class="alert alert-warning bg-warning bg-opacity-10 border-warning border-opacity-25 theme-text-main p-2.5 small mb-0 rounded-3 d-flex align-items-center gap-2">
                <i class="bi bi-info-circle text-warning fs-6"></i>
                <span>This action cannot be undone and will permanently remove this item.</span>
            </div>
        </div>

        <div class="modal-footer border-0 pt-1 d-flex align-items-center justify-content-end gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3.5 py-1.5 text-white border-secondary border-opacity-30" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-sm btn-danger rounded-pill px-4 py-1.5 fw-bold d-inline-flex align-items-center gap-1.5 shadow-sm">
                <i class="bi bi-trash3"></i>
                <span>Confirm Delete</span>
            </button>
        </div>
    </form>
</div>
