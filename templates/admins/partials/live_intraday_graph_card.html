{% load static %}
<!-- Current Day Intraday PnL Equity Curve Graph Card -->
<div class="card p-3.5 rounded-4 shadow-sm h-100" style="background: var(--card-bg); border: 1px solid var(--border-color);">
    <div class="d-flex align-items-center justify-content-between mb-3 border-bottom pb-2.5" style="border-color: var(--border-color) !important;">
        <div class="d-flex align-items-center gap-2">
            <div class="rounded-circle bg-primary bg-opacity-15 text-primary d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
                <i class="bi bi-graph-up text-primary fs-5"></i>
            </div>
            <div>
                <h5 class="fw-bold theme-text-main mb-0">Today's Intraday Equity Curve</h5>
                <small class="theme-text-muted">Real-time cumulative strategy P&amp;L progression (09:15 &rarr; 15:30 IST)</small>
            </div>
        </div>
        <div class="text-end">
            <div class="fw-bold font-monospace fs-5 {% if intraday_graph.current_pnl >= 0 %}text-success{% else %}text-danger{% endif %}">
                {% if intraday_graph.current_pnl >= 0 %}+{% endif %}₹{{ intraday_graph.current_pnl|floatformat:2 }}
            {% if intraday_graph.has_trades %}
                <span class="badge bg-success bg-opacity-25 text-success rounded-pill px-2 py-0.5 smaller fw-bold">Live Synced</span>
            {% else %}
                <span class="badge bg-secondary bg-opacity-25 text-white-50 rounded-pill px-2 py-0.5 smaller fw-bold">No Trades Today</span>
            {% endif %}
        </div>
    </div>

    <!-- Chart Canvas Container -->
    <div class="position-relative w-100" style="height: 190px;">
        <canvas id="liveIntradayEquityChart"></canvas>
    </div>
</div>

<script>
    (function() {
        function renderIntradayChart() {
            const ctx = document.getElementById('liveIntradayEquityChart');
            if (!ctx) return;

            const labels = {{ intraday_graph.labels|safe }};
            const pnlData = {{ intraday_graph.pnl_values|safe }};
            const isProfit = (pnlData.length > 0 && pnlData[pnlData.length - 1] >= 0);

            const lineColor = isProfit ? '#10B981' : '#EF4444';
            const fillColor = isProfit ? 'rgba(16, 185, 129, 0.12)' : 'rgba(239, 68, 68, 0.12)';

            if (window._intradayChartInstance) {
                window._intradayChartInstance.destroy();
            }

            window._intradayChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Intraday Net PnL (₹)',
                        data: pnlData,
                        borderColor: lineColor,
                        borderWidth: 2,
                        backgroundColor: fillColor,
                        fill: true,
                        tension: 0.35,
                        pointRadius: 2,
                        pointHoverRadius: 5,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const val = context.parsed.y;
                                    return (val >= 0 ? '+₹' : '-₹') + Math.abs(val).toFixed(2);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#94A3B8', font: { size: 10 } }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: {
                                color: '#94A3B8',
                                font: { size: 10 },
                                callback: function(val) {
                                    return (val >= 0 ? '+' : '') + val;
                                }
                            }
                        }
                    }
                }
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderIntradayChart);
        } else {
            renderIntradayChart();
        }
    })();
</script>
