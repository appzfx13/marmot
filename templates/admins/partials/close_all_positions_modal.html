<!-- templates/admins/partials/close_all_positions_modal.html -->
<div class="modal-content glass-card p-2 border-danger border-opacity-50" style="max-width: 520px; width: 100%; margin: 0 auto; border-radius: 16px;">
    <div class="modal-header border-0 pb-2">
        <h5 class="modal-title text-danger fw-bold d-flex align-items-center gap-2">
            <span class="material-icons text-danger fs-4">cancel</span>
            Close All Positions
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <form hx-post="{% url 'admins:admin-terminal-close-all-positions' %}" hx-swap="none" class="modal-body pt-1">
        {% csrf_token %}
        <input type="hidden" name="mode" value="{{ request.GET.mode|default:'LIVE' }}">
        <div class="p-3 mb-3 rounded-3 bg-danger bg-opacity-10 border border-danger border-opacity-25">
            <div class="d-flex align-items-start gap-2">
                <span class="material-icons text-danger mt-1">warning</span>
                <div>
                    <h6 class="fw-bold text-danger mb-1">MARKET SQUARE OFF</h6>
                    <p class="theme-text-muted small mb-0">
                        Are you sure you want to square off ALL open positions immediately at market price for account 
                        <strong class="theme-text-main">@{{ request.user.username }}</strong>?
                    </p>
                </div>
            </div>
        </div>

        <div class="modal-footer border-0 px-0 pb-0 pt-2 d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-danger rounded-pill px-4 fw-bold shadow">
                <span class="material-icons align-middle fs-6 me-1">cancel</span>
                CLOSE ALL POSITIONS
            </button>
        </div>
    </form>
</div>
