<form id="login-form" hx-post="{% url 'admins:admin-login' %}" hx-target="#login-form" hx-swap="outerHTML" novalidate>
    {% csrf_token %}

    <style>
        .admin-form-label {
            color: var(--text-subtitle);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 6px;
            display: block;
            text-align: left;
        }

        .admin-form-control {
            background-color: var(--input-bg) !important;
            border: 1px solid var(--input-border) !important;
            color: var(--input-text) !important;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.9375rem;
            width: 100%;
            transition: all 0.2s ease;
        }

        .admin-form-control::placeholder {
            color: var(--input-placeholder) !important;
        }

        .admin-form-control:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2) !important;
            border-color: #ef4444 !important;
            outline: none;
        }

        .admin-password-wrapper {
            position: relative;
        }

        .admin-password-toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .admin-password-toggle-btn:hover {
            color: var(--text-title);
        }

        .btn-admin-submit {
            background: var(--btn-admin);
            color: var(--btn-text);
            border: none;
            border-radius: 50px;
            padding: 13px 24px;
            font-size: 0.9375rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-admin-submit:hover {
            background: var(--btn-admin-hover);
            color: var(--btn-text);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }
    </style>

    {% if form.non_field_errors %}
    <div class="alert alert-danger py-2 px-3 small rounded-3 mb-3 text-start">
        {% for error in form.non_field_errors %}
        <div>{{ error }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="mb-3 text-start">
        <label for="id_admin_username" class="admin-form-label">Admin Username</label>
        <input type="text"
               name="username"
               id="id_admin_username"
               class="admin-form-control"
               placeholder="Enter admin username"
               value="{{ form.username.value|default:'' }}"
               required
               autocomplete="username">
        {% if form.username.errors %}
        <div class="text-danger small mt-1">{{ form.username.errors.0 }}</div>
        {% endif %}
    </div>

    <div class="mb-4 text-start">
        <label for="id_admin_password" class="admin-form-label">Master Password</label>
        <div class="admin-password-wrapper">
            <input type="password"
                   name="password"
                   id="id_admin_password"
                   class="admin-form-control"
                   placeholder="••••••••"
                   required
                   autocomplete="current-password">
            <button type="button" class="admin-password-toggle-btn" id="toggleAdminPasswordBtn" aria-label="Toggle password visibility">
                <span class="material-icons" id="toggleAdminPasswordIcon" style="font-size: 20px;">visibility_off</span>
            </button>
        </div>
        {% if form.password.errors %}
        <div class="text-danger small mt-1">{{ form.password.errors.0 }}</div>
        {% endif %}
    </div>

    <button type="submit" class="btn btn-admin-submit">
        <span>Authenticate Admin</span>
        <span class="material-icons" style="font-size: 18px;">arrow_forward</span>
    </button>
</form>

<script>
    (function() {
        const toggleBtn = document.getElementById('toggleAdminPasswordBtn');
        const passwordInput = document.getElementById('id_admin_password');
        const toggleIcon = document.getElementById('toggleAdminPasswordIcon');

        if (toggleBtn && passwordInput && toggleIcon) {
            toggleBtn.addEventListener('click', function() {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                toggleIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
            });
        }
    })();
</script>
