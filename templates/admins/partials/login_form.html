<form id="login-form" hx-post="{% url 'admins:admin-login' %}" hx-target="#login-form" hx-swap="outerHTML" novalidate>
    {% csrf_token %}

    {% if form.non_field_errors %}
    <div class="alert alert-danger py-2 px-3 rounded-3 small mb-3 border-0 d-flex align-items-center gap-2" style="background: rgba(239, 68, 68, 0.15); color: #ef4444;">
        <i class="bi bi-exclamation-triangle-fill"></i>
        {% for error in form.non_field_errors %}
        <span>{{ error }}</span>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Admin Username Input Group -->
    <div class="login-form-group text-start">
        <label for="id_admin_username" class="login-form-label">Admin Username</label>
        <div class="login-input-group">
            <i class="bi bi-person-badge input-icon"></i>
            <input type="text"
                   name="username"
                   id="id_admin_username"
                   class="login-input"
                   placeholder="Enter admin username"
                   value="{{ form.username.value|default:'' }}"
                   required
                   autofocus
                   autocomplete="username">
        </div>
        {% if form.username.errors %}
        <div class="text-danger small mt-1 ps-1">{{ form.username.errors.0 }}</div>
        {% endif %}
    </div>

    <!-- Admin Password Input Group -->
    <div class="login-form-group text-start">
        <label for="id_admin_password" class="login-form-label">Master Password</label>
        <div class="login-input-group">
            <i class="bi bi-shield-lock input-icon"></i>
            <input type="password"
                   name="password"
                   id="id_admin_password"
                   class="login-input login-input-password"
                   placeholder="••••••••"
                   required
                   autocomplete="current-password">
            <button type="button" class="password-toggle-btn" id="toggleAdminPasswordBtn" aria-label="Toggle password visibility">
                <i class="bi bi-eye" id="toggleAdminPasswordIcon"></i>
            </button>
        </div>
        {% if form.password.errors %}
        <div class="text-danger small mt-1 ps-1">{{ form.password.errors.0 }}</div>
        {% endif %}
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn-login mt-4" id="adminSubmitBtn">
        <span>Authenticate Admin</span>
        <i class="bi bi-arrow-right"></i>
    </button>
</form>

<script>
    (function() {
        const toggleBtn = document.getElementById('toggleAdminPasswordBtn');
        const passwordInput = document.getElementById('id_admin_password');
        const toggleIcon = document.getElementById('toggleAdminPasswordIcon');

        if (toggleBtn && passwordInput && toggleIcon) {
            toggleBtn.addEventListener('click', function() {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                toggleIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
            });
        }

        const loginForm = document.getElementById('login-form');
        const submitBtn = document.getElementById('adminSubmitBtn');
        if (loginForm && submitBtn) {
            loginForm.addEventListener('submit', function() {
                if (submitBtn.classList.contains('disabled')) return;
                submitBtn.classList.add('disabled');
                submitBtn.innerHTML = '<span>Authenticating...</span><div class="spinner-border spinner-border-sm text-light ms-2" role="status"></div>';
            });
        }
    })();
</script>
