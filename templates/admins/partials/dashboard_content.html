<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="fw-bold mb-1 theme-text-main">Admin Dashboard</h1>
        <p class="mb-0 theme-text-muted">Overview of active traders and platform metrics</p>
    </div>
    <a href="{% url 'admins:marmot_trader_create' %}" class="btn theme-btn-primary fw-bold d-flex align-items-center gap-1 shadow-sm">
        <span class="material-icons fs-5">person_add</span> Add New Trader
    </a>
</div>

<!-- Admin Metrics Row -->
<div class="row g-3 mb-4">
    <div class="col-12 col-md-6">
        <div class="metric-card">
            <p class="theme-text-muted mb-1 fw-medium">Total Traders</p>
            <h2 class="theme-text-main fw-bold mb-0">{{ total_traders|default:0 }}</h2>
        </div>
    </div>
    <div class="col-12 col-md-6">
        <div class="metric-card">
            <p class="theme-text-muted mb-1 fw-medium">Eligible Traders</p>
            <h2 class="text-success fw-bold mb-0">{{ active_traders|default:0 }}</h2>
        </div>
    </div>
</div>

<div class="glass-card p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="theme-text-main fw-bold mb-0">Quick Actions</h5>
    </div>
    <div class="d-flex gap-2 flex-wrap">
        <a href="{% url 'admins:marmot_trader_list' %}" class="btn theme-btn-secondary d-flex align-items-center gap-2 fw-medium">
            <span class="material-icons fs-5">people</span> Manage Traders
        </a>
    </div>
</div>
