<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="text-white fw-bold mb-1">Admin Dashboard</h1>
        <p class="text-white-50 mb-0">Overview of active traders and platform metrics</p>
    </div>
    <a href="{% url 'admins:marmot_trader_create' %}" class="btn btn-light fw-bold d-flex align-items-center gap-1">
        <span class="material-icons fs-5">person_add</span> Add New Trader
    </a>
</div>

<!-- Admin Metrics Row -->
<div class="row g-3 mb-4">
    <div class="col-12 col-md-6">
        <div class="metric-card">
            <p class="text-white-50 mb-1">Total Traders</p>
            <h2 class="text-white">{{ total_traders|default:0 }}</h2>
        </div>
    </div>
    <div class="col-12 col-md-6">
        <div class="metric-card">
            <p class="text-white-50 mb-1">Eligible Traders</p>
            <h2 class="text-white text-success">{{ active_traders|default:0 }}</h2>
        </div>
    </div>
</div>

<div class="glass-card p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="text-white fw-bold mb-0">Quick Actions</h5>
    </div>
    <div class="d-flex gap-2 flex-wrap">
        <a href="{% url 'admins:marmot_trader_list' %}" class="btn btn-outline-light d-flex align-items-center gap-2">
            <span class="material-icons fs-5">people</span> Manage Traders
        </a>
    </div>
</div>
