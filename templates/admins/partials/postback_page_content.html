{% load static %}
<div class="d-flex flex-column gap-4">

    <!-- START: Spark Page Header -->
    <div class="page-header d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
        <div>
            <h1 class="page-title">{{ page_title }}</h1>
            <p class="page-subtitle">Inspect real-time incoming DhanHQ &amp; broker webhook postback execution telemetry per user.</p>
        </div>
        <div class="page-header-actions d-flex align-items-center gap-2 flex-wrap">
            <div class="dropdown bulk-dropdown d-none">
                <button class="btn btn-outline-danger rounded-pill px-3 py-1.5 fw-semibold dropdown-toggle d-inline-flex align-items-center gap-2 shadow-sm" 
                        type="button" 
                        data-bs-toggle="dropdown" 
                        aria-expanded="false"
                        title="Bulk Operations">
                    <i class="bi bi-three-dots-vertical"></i>
                    <span>Bulk Actions</span>
                    <span class="badge bg-danger rounded-pill bulk-selected-count">0</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end dropdown-menu-custom">
                    <li>
                        <a class="dropdown-item text-danger d-flex align-items-center gap-2" 
                           href="javascript:void(0);" 
                           onclick="triggerBulkDelete(this, '{% url 'admins:postback_bulk_delete' %}')">
                            <i class="bi bi-trash"></i>
                            <span>Delete Selected (<span class="badge bg-danger rounded-pill bulk-selected-count">0</span>)</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <!-- END: Spark Page Header -->

    <!-- Search & Filter Controls -->
    <div class="card mb-0">
        <div class="card-body p-3 p-md-4">
            <form method="GET" action="{{ request.path }}" class="row g-3 align-items-center">
                
                <!-- Search Input -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 theme-text-muted border-secondary border-opacity-25">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" 
                               name="q" 
                               value="{{ current_q }}" 
                               class="form-control bg-transparent border-start-0 theme-text-main border-secondary border-opacity-25" 
                               placeholder="Order ID, symbol..." 
                               hx-get="{{ request.path }}"
                               hx-target="#postback-list-container"
                               hx-trigger="input changed delay:400ms, search"
                               hx-include="[name='user_id'], [name='start_date'], [name='end_date']"
                               hx-push-url="true">
                    </div>
                </div>

                <!-- User Filter -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <select name="user_id" 
                            class="form-select bg-transparent theme-text-main border-secondary border-opacity-25"
                            hx-get="{{ request.path }}"
                            hx-target="#postback-list-container"
                            hx-trigger="change"
                            hx-include="[name='q'], [name='start_date'], [name='end_date']"
                            hx-push-url="true">
                        <option value="" class="text-dark">All Users</option>
                        {% for u in users_list %}
                        <option value="{{ u.id }}" class="text-dark" {% if current_user_id == u.id|stringformat:"i" %}selected{% endif %}>
                            {{ u.username }} ({% if u.role %}{{ u.role|title }}{% else %}Trader{% endif %})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Start Date Filter -->
                <div class="col-12 col-sm-6 col-lg-2">
                    <input type="date" 
                           name="start_date" 
                           value="{{ current_start_date }}"
                           class="form-control bg-transparent theme-text-main border-secondary border-opacity-25"
                           placeholder="Start Date"
                           hx-get="{{ request.path }}"
                           hx-target="#postback-list-container"
                           hx-trigger="change"
                           hx-include="[name='q'], [name='user_id'], [name='end_date']"
                           hx-push-url="true">
                </div>

                <!-- End Date Filter -->
                <div class="col-12 col-sm-6 col-lg-2">
                    <input type="date" 
                           name="end_date" 
                           value="{{ current_end_date }}"
                           class="form-control bg-transparent theme-text-main border-secondary border-opacity-25"
                           placeholder="End Date"
                           hx-get="{{ request.path }}"
                           hx-target="#postback-list-container"
                           hx-trigger="change"
                           hx-include="[name='q'], [name='user_id'], [name='start_date']"
                           hx-push-url="true">
                </div>

                <!-- Reset Button -->
                <div class="col-12 col-sm-6 col-lg-2 ms-auto">
                    <a href="{{ request.path }}" 
                       class="btn btn-outline-secondary rounded-pill theme-text-muted border-secondary border-opacity-25 w-100 d-inline-flex align-items-center justify-content-center gap-1.5"
                       hx-get="{{ request.path }}"
                       hx-target="#postback-list-container"
                       hx-push-url="true">
                        <i class="bi bi-arrow-counterclockwise"></i>
                        <span>Reset</span>
                    </a>
                </div>

            </form>
        </div>
    </div>

    <!-- HTMX Container -->
    <div id="postback-list-container" class="w-100"
         hx-get="{{ request.get_full_path }}" 
         hx-trigger="reloadPostbackTable from:body" 
         hx-target="#postback-list-container"
         hx-swap="innerHTML">
        {% include 'admins/partials/postback_list_content.html' %}
    </div>

</div>
