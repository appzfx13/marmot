{% load static %}
<div class="d-flex flex-column gap-4">

    <!-- START: Spark Page Header -->
    <div class="page-header d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
        <div>
            <h1 class="page-title">Trade Execution Configurations</h1>
            <p class="page-subtitle">Search, filter, and manage automated trading rules, market allocations, and risk parameters.</p>
        </div>
        <div class="page-header-actions d-flex align-items-center gap-2 flex-wrap">
            <div class="dropdown bulk-dropdown d-none">
                <button class="btn btn-outline-danger rounded-pill px-3 py-1.5 fw-semibold dropdown-toggle d-inline-flex align-items-center gap-2 shadow-sm" 
                        type="button" 
                        data-bs-toggle="dropdown" 
                        aria-expanded="false"
                        title="Bulk Operations">
                    <i class="bi bi-three-dots-vertical"></i>
                    <span>Bulk Actions</span>
                    <span class="badge bg-danger rounded-pill bulk-selected-count">0</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end dropdown-menu-custom">
                    <li>
                        <a class="dropdown-item text-danger d-flex align-items-center gap-2" 
                           href="javascript:void(0);" 
                           onclick="triggerBulkDelete(this, '{% url 'admins:trade_exec_config_bulk_delete' %}')">
                            <i class="bi bi-trash"></i>
                            <span>Delete Selected (<span class="bulk-selected-count">0</span>)</span>
                        </a>
                    </li>
                </ul>
            </div>

            <a href="{% url 'admins:trade_exec_config_create' %}" 
               class="btn btn-primary rounded-pill fw-semibold text-white d-inline-flex align-items-center justify-content-center gap-2 px-4 py-2 shadow-sm" 
               hx-get="{% url 'admins:trade_exec_config_create' %}"
               hx-target="#app-main-container"
               hx-push-url="true">
                <i class="bi bi-plus-circle-fill"></i>
                <span>New Configuration</span>
            </a>
        </div>
    </div>
    <!-- END: Spark Page Header -->

    <!-- Search & Filter Controls -->
    <div class="card mb-0">
        <div class="card-body p-3 p-md-4">
            <form method="GET" action="{% url 'admins:trade_exec_config_list' %}" class="row g-3 align-items-center">
                
                <!-- Filter by Config Name (`name`) -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 theme-text-muted border-secondary border-opacity-25">
                            <i class="bi bi-sliders"></i>
                        </span>
                        <input type="text" 
                               name="name" 
                               value="{{ request.GET.name }}" 
                               class="form-control bg-transparent border-start-0 theme-text-main border-secondary border-opacity-25" 
                               placeholder="Config Name..."
                               hx-get="{% url 'admins:trade_exec_config_list' %}"
                               hx-target="#configTableContainer"
                               hx-trigger="input changed delay:400ms, search"
                               hx-include="[name='q'], [name='is_active']"
                               hx-push-url="true">
                    </div>
                </div>

                <!-- Filter by Marmot User (`admins_user` details) -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 theme-text-muted border-secondary border-opacity-25">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" 
                               name="q" 
                               value="{{ request.GET.q }}" 
                               class="form-control bg-transparent border-start-0 theme-text-main border-secondary border-opacity-25" 
                               placeholder="User, email..."
                               hx-get="{% url 'admins:trade_exec_config_list' %}"
                               hx-target="#configTableContainer"
                               hx-trigger="input changed delay:400ms, search"
                               hx-include="[name='name'], [name='is_active']"
                               hx-push-url="true">
                    </div>
                </div>

                <!-- Filter by Active Status (`is_active`) -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <select name="is_active" 
                            class="form-select bg-transparent theme-text-main border-secondary border-opacity-25"
                            hx-get="{% url 'admins:trade_exec_config_list' %}"
                            hx-target="#configTableContainer"
                            hx-trigger="change"
                            hx-include="[name='name'], [name='q']"
                            hx-push-url="true">
                        <option value="" class="text-dark">All Statuses</option>
                        <option value="true" class="text-dark" {% if request.GET.is_active == 'true' %}selected{% endif %}>Active</option>
                        <option value="false" class="text-dark" {% if request.GET.is_active == 'false' %}selected{% endif %}>Inactive</option>
                    </select>
                </div>

                <!-- Reset Button -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <a href="{% url 'admins:trade_exec_config_list' %}" 
                       class="btn btn-outline-secondary rounded-pill theme-text-muted border-secondary border-opacity-25 w-100 d-inline-flex align-items-center justify-content-center gap-1.5"
                       hx-get="{% url 'admins:trade_exec_config_list' %}"
                       hx-target="#configTableContainer"
                       hx-push-url="true">
                        <i class="bi bi-arrow-counterclockwise"></i>
                        <span>Reset</span>
                    </a>
                </div>

            </form>
        </div>
    </div>

    <!-- Container for dynamic table swap -->
    <div id="configTableContainer" class="w-100"
         hx-get="{{ request.get_full_path }}" 
         hx-trigger="reloadConfigTable from:body" 
         hx-target="#configTableContainer"
         hx-swap="innerHTML">
        {% include 'admins/partials/trade_exec_config_table_partial.html' %}
    </div>

</div>
