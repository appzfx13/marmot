{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Portal — Marmot Core Control</title>

    <!-- SEO Optimization -->
    <meta name="description" content="Admin Portal — Marmot Core Control & Management System">
    <meta name="author" content="Marmot Core">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/ref/logo/logo-icon.png' %}">
    <link rel="shortcut icon" href="{% static 'images/ref/logo/logo-icon.png' %}">

    <!-- Third-Party Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Main Design System & Custom Stylesheet -->
    <link rel="stylesheet" href="{% static 'css/spark-theme.css' %}">
    <style>html { font-size: 87.5%; }</style>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>

    <!-- ==========================================
         Theme Toggle Button (Top Right Corner)
         ========================================== -->
    <div class="theme-toggle-corner">
        <button type="button" 
                class="btn btn-sm rounded-pill d-inline-flex align-items-center gap-2 px-3 py-1.5 shadow-sm" 
                id="themeToggleBtn" 
                title="Toggle Theme" 
                style="background: var(--card-background); border: 1px solid var(--border-color); color: var(--text-main);">
            <i class="bi bi-moon-stars-fill" id="themeIcon" style="color: var(--brand-lime);"></i>
            <span class="small fw-semibold" id="themeText">Dark</span>
        </button>
    </div>

    <!-- ==========================================
         Authentication Container & Login Card
         ========================================== -->
    <div class="login-wrapper">
        <!-- Glowing background shapes for modern visual appearance -->
        <div class="login-bg-shape login-bg-shape-1"></div>
        <div class="login-bg-shape login-bg-shape-2"></div>
        
        <!-- Main centered login card -->
        <div class="login-card">
            
            <!-- Brand Identity -->
            <a href="{% url 'home' %}" class="login-brand text-decoration-none">
                <i class="bi bi-asterisk"></i>
                <span>MARMOT ADMIN</span>
            </a>
            
            <div class="text-center mb-4">
                <span class="badge bg-danger bg-opacity-25 text-danger border border-danger border-opacity-25 rounded-pill px-3 py-1 small fw-semibold">
                    <i class="bi bi-shield-lock-fill me-1"></i> Restricted Area · Authorized Personnel Only
                </span>
            </div>

            <h1 class="login-title">Control Access</h1>
            <p class="login-subtitle">Authenticate to access platform infrastructure and settings</p>
            
            <!-- HTMX Partial Form Included Here -->
            {% include "admins/partials/login_form.html" %}

            <!-- Footer Link -->
            <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center">
                <p class="login-footer-text">
                    <a href="{% url 'users:marmot-login' %}" class="text-decoration-none d-inline-flex align-items-center gap-1.5 small">
                        <i class="bi bi-arrow-left"></i>
                        <span>Return to Trader Portal</span>
                    </a>
                </p>
            </div>
            
        </div>
    </div>
    <!-- END: Authentication Container -->

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Theme & Password Toggle Interactions -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('marmot-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeUI(savedTheme);

            const toggleBtn = document.getElementById('themeToggleBtn');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('marmot-theme', newTheme);
                    updateThemeUI(newTheme);
                });
            }

            function updateThemeUI(theme) {
                const icon = document.getElementById('themeIcon');
                const text = document.getElementById('themeText');
                if (theme === 'dark') {
                    if (icon) icon.className = 'bi bi-moon-stars-fill';
                    if (text) text.textContent = 'Dark';
                } else {
                    if (icon) icon.className = 'bi bi-sun-fill';
                    if (text) text.textContent = 'Light';
                }
            }
        })();
    </script>
</body>
</html>
