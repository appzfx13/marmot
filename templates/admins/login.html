{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Portal — Marmot Core Control</title>

    <!-- Bootstrap 5 CSS & Google Fonts/Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,400..700;1,400..700&family=Google+Sans+Flex:opsz,slnt,wdth,wght,ROND@8..144,-10..0,25..150,400..700,0..100&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Symbols:opsz,wght,FILL,GRAD,ROND@20..48,100..700,0..1,-50..200,0..100&display=block" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'images/ref/logo/logo-icon.png' %}">
    <link rel="shortcut icon" href="{% static 'images/ref/logo/logo-icon.png' %}">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <style>
        :root[data-theme="dark"] {
            --bg-page: #000000;
            --bg-card: rgba(13, 18, 30, 0.75);
            --card-border: rgba(239, 68, 68, 0.25);
            --text-title: #ffffff;
            --text-subtitle: rgba(255, 255, 255, 0.72);
            --text-muted: rgba(255, 255, 255, 0.45);
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-text: #ffffff;
            --input-placeholder: rgba(255, 255, 255, 0.45);
            --btn-admin: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            --btn-admin-hover: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            --btn-text: #ffffff;
            --toggle-bg: rgba(255, 255, 255, 0.08);
            --toggle-border: rgba(255, 255, 255, 0.12);
            --badge-bg: rgba(239, 68, 68, 0.12);
            --badge-text: #f87171;
            --badge-border: rgba(239, 68, 68, 0.3);
            --aurora-1: rgba(239, 68, 68, 0.15);
            --aurora-2: rgba(122, 90, 248, 0.12);
        }

        :root[data-theme="light"] {
            --bg-page: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.92);
            --card-border: rgba(239, 68, 68, 0.25);
            --text-title: #0f172a;
            --text-subtitle: #475569;
            --text-muted: #64748b;
            --input-bg: #f8fafc;
            --input-border: #cbd5e1;
            --input-text: #0f172a;
            --input-placeholder: #94a3b8;
            --btn-admin: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            --btn-admin-hover: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            --btn-text: #ffffff;
            --toggle-bg: rgba(0, 0, 0, 0.05);
            --toggle-border: rgba(0, 0, 0, 0.1);
            --badge-bg: rgba(239, 68, 68, 0.08);
            --badge-text: #dc2626;
            --badge-border: rgba(239, 68, 68, 0.2);
            --aurora-1: rgba(239, 68, 68, 0.06);
            --aurora-2: rgba(122, 90, 248, 0.04);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Google Sans Flex', 'Google Sans', -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(circle at 50% 15%, var(--aurora-1) 0%, transparent 55%),
                radial-gradient(circle at 80% 40%, var(--aurora-2) 0%, transparent 45%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 72px 14px 28px 14px;
            position: relative;
            letter-spacing: -0.01em;
            transition: background-color 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ambient-blob-container {
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            pointer-events: none;
            opacity: 0.7;
            max-width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .ambient-blob-container svg {
            max-width: 100vw;
            width: 700px;
            height: auto;
        }

        .auth-nav-top {
            position: fixed;
            top: 14px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            max-width: 100%;
            pointer-events: none;
        }

        .auth-nav-btn {
            background: var(--toggle-bg);
            border: 1px solid var(--toggle-border);
            color: var(--text-title);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 50px;
            padding: 7px 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            font-size: 0.8125rem;
            font-weight: 600;
            transition: all 0.2s ease;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .auth-nav-btn:hover {
            color: var(--text-title);
            transform: translateY(-1px);
        }

        .auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            background: var(--bg-card);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 34px 28px;
            box-shadow: 0 20px 45px -10px rgba(220, 38, 38, 0.18);
            animation: cardFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (max-width: 576px) {
            body {
                padding: 64px 12px 24px 12px;
            }
            .auth-nav-top {
                top: 10px;
                left: 12px;
                right: 12px;
            }
            .auth-nav-btn {
                padding: 6px 12px;
                font-size: 0.75rem;
            }
            .auth-card {
                padding: 24px 16px;
                border-radius: 20px;
                max-width: 100%;
            }
            .auth-title {
                font-size: 1.35rem !important;
            }
            .auth-subtitle {
                font-size: 0.8125rem !important;
                margin-bottom: 18px !important;
            }
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--badge-border);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.6875rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .auth-title {
            color: var(--text-title);
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .auth-subtitle {
            color: var(--text-subtitle);
            font-size: 0.875rem;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .form-label {
            color: var(--text-subtitle);
            font-size: 0.8125rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .form-control {
            background-color: var(--input-bg) !important;
            border: 1px solid var(--input-border) !important;
            color: var(--input-text) !important;
            border-radius: 12px;
            padding: 9px 14px;
            font-size: 0.875rem;
            height: 44px;
            transition: all 0.2s ease;
        }

        .auth-footer-link {
            color: var(--text-subtitle);
            font-size: 0.875rem;
            text-align: center;
            margin-top: 24px;
        }

        .auth-footer-link a {
            color: var(--badge-text);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <div class="auth-nav-top">
        <a href="{% url 'home' %}" class="auth-nav-btn">
            <span class="material-icons" style="font-size: 18px;">arrow_back</span>
            <span>Home</span>
        </a>

        <button class="auth-nav-btn" id="themeToggleBtn" type="button" aria-label="Toggle Theme">
            <span class="material-icons" id="themeToggleIcon" style="font-size: 18px;">dark_mode</span>
            <span id="themeToggleText">Dark</span>
        </button>
    </div>

    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="mb-3">
                <img src="{% static 'images/ref/logo/logo-icon.png' %}" alt="Marmot" height="52" style="filter: drop-shadow(0 4px 16px rgba(220, 38, 38, 0.4));">
            </div>
            <div class="admin-badge">
                <span class="material-icons" style="font-size: 14px;">shield</span>
                <span>System Administration</span>
            </div>
            <h1 class="auth-title">Admin Portal</h1>
            <p class="auth-subtitle">Elevated authentication required for core engine controls</p>
        </div>

        <div id="login-form-wrapper">
            {% include "admins/partials/login_form.html" %}
        </div>

        <div class="auth-footer-link">
            Are you a standard trader? <a href="{% url 'users:marmot-login' %}">Sign in to Trader Terminal</a>
        </div>
    </div>

    <!-- Ambient SVG Glow (Red + Blue hue for Admin) -->
    <div class="ambient-blob-container">
        <svg width="930" height="760" viewBox="0 0 930 760" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g opacity="0.35" filter="url(#filter0_f_blob)">
                <circle cx="380.335" cy="380.335" r="179.665" fill="#EF4444" />
            </g>
            <g opacity="0.55" filter="url(#filter1_f_blob)">
                <circle cx="549.665" cy="380.335" r="179.665" fill="#3B82F6" />
            </g>
            <defs>
                <filter id="filter0_f_blob" x="0.67" y="0.67" width="759.33" height="759.33" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
                    <feFlood flood-opacity="0" result="BackgroundImageFix" />
                    <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
                    <feGaussianBlur stdDeviation="100" result="effect1_foregroundBlur" />
                </filter>
                <filter id="filter1_f_blob" x="170" y="0.67" width="759.33" height="759.33" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
                    <feFlood flood-opacity="0" result="BackgroundImageFix" />
                    <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
                    <feGaussianBlur stdDeviation="100" result="effect1_foregroundBlur" />
                </filter>
            </defs>
        </svg>
    </div>

    <script>
        document.body.addEventListener('htmx:beforeOnLoad', function (evt) {
            if (evt.detail.xhr.status === 422 || evt.detail.xhr.status === 500) {
                evt.detail.shouldSwap = true;
                evt.detail.isError = false;
            }
        });

        // Theme Toggle
        (function() {
            const htmlElement = document.documentElement;
            const toggleBtn = document.getElementById('themeToggleBtn');
            const toggleIcon = document.getElementById('themeToggleIcon');
            const toggleText = document.getElementById('themeToggleText');

            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const currentTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');

            function applyTheme(theme) {
                htmlElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);

                if (theme === 'dark') {
                    if (toggleIcon) toggleIcon.textContent = 'dark_mode';
                    if (toggleText) toggleText.textContent = 'Dark';
                } else {
                    if (toggleIcon) toggleIcon.textContent = 'light_mode';
                    if (toggleText) toggleText.textContent = 'Light';
                }
            }

            applyTheme(currentTheme);

            if (toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    const activeTheme = htmlElement.getAttribute('data-theme');
                    const newTheme = activeTheme === 'dark' ? 'light' : 'dark';
                    applyTheme(newTheme);
                });
            }
        })();
    </script>
</body>
</html>
