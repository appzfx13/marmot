{% extends "admins/index.html" %}

{% block title %}Confirm Delete Trader | Bug Tracker{% endblock %}

{% block dashboard_content %}
<div class="w-100 col-12">
    <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-8">
            <!-- Glassmorphic Warning Card -->
            <div class="glass-card p-4 border-danger shadow-lg">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <div class="neo-icon-wrapper-danger rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                        <span class="material-icons text-danger fs-3">warning_amber</span>
                    </div>
                    <div>
                        <h4 class="theme-text-main fw-bold mb-0">Confirm Deletion</h4>
                        <span class="theme-text-muted small">This action will soft-delete the trader profile.</span>
                    </div>
                </div>

                <hr class="border-secondary opacity-25 my-3">

                <!-- Form Actions -->
                <form method="post" hx-post="{{ request.path }}" hx-target="#mainContentBody" hx-swap="outerHTML">
                    {% csrf_token %}
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'admins:trader_list' %}" class="btn btn-outline-light rounded-pill px-4">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-danger rounded-pill px-4 fw-bold d-flex align-items-center gap-2">
                            <span class="material-icons fs-6">delete_forever</span>
                            <span>Confirm & Delete</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
