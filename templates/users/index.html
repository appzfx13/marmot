{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dashboard - Bug Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <!-- HTMX Scripts -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/head-support.js"></script>

    <!-- Style block omitted for brevity (Keep existing styles) -->
    {% block extra_head %}{% endblock %}
</head>
<body hx-ext="head-support" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <div id="glass-toast-container"></div>

    <!-- Notification Bell & Floating Elements remain unchanged -->
    ...

    <div class="d-flex flex-column flex-md-row">
        <div class="sidebar p-4 vh-100 position-fixed d-flex flex-column" id="mainSidebar">
            <div class="mb-4 d-flex align-items-center justify-content-between">
                <div>
                    <h3 class="text-white fw-bold mb-1">Bug Tracker</h3>
                    <p class="text-white-50 mb-0">Welcome back!</p>
                </div>
            </div>

            <!-- HTMX SPA Navigation Container -->
            <nav class="nav flex-column flex-grow-1" id="sidebarNavigationContent"
                 hx-target="#mainContentBody"
                 hx-swap="innerHTML"
                 hx-select="#mainContentBody > *"
                 hx-push-url="true">
                
                <a class="nav-link fs-5 py-2 {% block nav_dashboard_active %}{% endblock %}" 
                   href="{% url 'users:marmot-dashboard' %}" 
                   hx-get="{% url 'users:marmot-dashboard' %}">
                    <span class="material-icons me-2">dashboard</span>Dashboard
                </a>
                <a class="nav-link fs-5 py-2 {% block nav_teams_active %}{% endblock %}" 
                   href="{% url 'users:team_list' %}" 
                   hx-get="{% url 'users:team_list' %}">
                    <span class="material-icons me-2">groups</span>Teams
                </a>
                <a class="nav-link fs-5 py-2 {% block nav_teammembers_active %}{% endblock %}" 
                   href="{% url 'users:teammember_list' %}" 
                   hx-get="{% url 'users:teammember_list' %}">
                    <span class="material-icons me-2">group</span>Team Members
                </a>
                <a class="nav-link fs-5 py-2 {% block nav_projects_active %}{% endblock %}" 
                   href="{% url 'issues:project_list' %}" 
                   hx-get="{% url 'issues:project_list' %}">
                    <span class="material-icons me-2">folder</span>Projects
                </a>
                <a class="nav-link fs-5 py-2 {% block nav_issues_active %}{% endblock %}" 
                   href="{% url 'issues:issue_list' %}" 
                   hx-get="{% url 'issues:issue_list' %}">
                    <span class="material-icons me-2">bug_report</span>Issues
                </a>
                <a class="nav-link fs-5 py-2 {% block nav_my_issues_active %}{% endblock %}" 
                   href="{% url 'issues:my_issue_list' %}" 
                   hx-get="{% url 'issues:my_issue_list' %}">
                    <span class="material-icons me-2">task</span>My Tasks
                </a>
                <a class="nav-link fs-5 py-2 {% block nav_tags_active %}{% endblock %}" 
                   href="{% url 'issues:tag_list' %}" 
                   hx-get="{% url 'issues:tag_list' %}">
                    <span class="material-icons me-2">label</span>Tags
                </a>
            </nav>

            <button type="button" class="btn btn-light d-flex align-items-center mt-5 fs-5 py-2 w-100 justify-content-center" data-bs-toggle="modal" data-bs-target="#logoutModal">
                <span class="material-icons me-2">logout</span>Logout
            </button>
        </div>

        <!-- Main Content Area -->
        <div class="flex-grow-1 p-4 main-with-sidebar" id="mainContentBody">
            {% block dashboard_content %}{% endblock %}
        </div>
    </div>

    <!-- Re-initialize dynamic JS handlers after HTMX content swaps -->
    <script>
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target.id === 'mainContentBody') {
                // Update active state on sidebar links
                const currentPath = window.location.pathname;
                document.querySelectorAll('#sidebarNavigationContent .nav-link').forEach(link => {
                    if (link.getAttribute('href') === currentPath) {
                        link.classList.add('active');
                    } else {
                        link.classList.remove('active');
                    }
                });
            }
        });
    </script>
</body>
</html>
