<!-- templates/users/partials/journal_content.html -->
<div class="user-journal-viewport">
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
        <div>
            <h2 class="fw-bold theme-text-main mb-1 d-flex align-items-center gap-2">
                <span class="material-icons text-primary fs-3">menu_book</span>
                <span>Trader Execution Journal</span>
            </h2>
            <p class="theme-text-muted small mb-0">Record trade logs, execution notes, and daily strategy metrics.</p>
        </div>
    </div>

    <!-- Journal Overview Cards -->
    <div class="row g-3 mb-4">
        <div class="col-12 col-md-4">
            <div class="glass-card p-3 rounded-4 border theme-text-main" style="background: var(--glass-bg); border-color: var(--border-color) !important;">
                <span class="small theme-text-muted text-uppercase fw-bold">Total Journal Entries</span>
                <h3 class="fw-bold mb-0 mt-1 theme-text-main">0</h3>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="glass-card p-3 rounded-4 border theme-text-main" style="background: var(--glass-bg); border-color: var(--border-color) !important;">
                <span class="small theme-text-muted text-uppercase fw-bold">Win Rate</span>
                <h3 class="fw-bold mb-0 mt-1 text-success">0.00%</h3>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="glass-card p-3 rounded-4 border theme-text-main" style="background: var(--glass-bg); border-color: var(--border-color) !important;">
                <span class="small theme-text-muted text-uppercase fw-bold">Avg Risk / Reward</span>
                <h3 class="fw-bold mb-0 mt-1 text-info">1 : 2.5</h3>
            </div>
        </div>
    </div>

    <!-- Journal Table Container -->
    <div class="glass-card p-4 rounded-4 border shadow-sm" style="background: var(--glass-bg); border-color: var(--border-color) !important;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold theme-text-main mb-0">Trade Execution History</h5>
        </div>
        <div class="text-center py-5 theme-text-muted">
            <span class="material-icons fs-1 mb-2">menu_book</span>
            <p class="mb-0">No journal logs recorded yet for trader @{{ request.user.username }}.</p>
        </div>
    </div>
</div>
