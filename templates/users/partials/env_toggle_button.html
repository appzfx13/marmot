<!-- templates/users/partials/env_toggle_button.html -->
<button type="button"
        id="envToggleBadgeBtn"
        class="btn btn-sm rounded-pill px-3 py-1 fw-bold d-inline-flex align-items-center justify-content-center gap-1 shadow-sm {% if request.user.watching_on == 'LIVE' %}btn-success text-white{% else %}btn-secondary text-white-50{% endif %}"
        style="min-width: 125px; height: 32px;"
        hx-get="{% url 'users:user-env-toggle-modal' %}"
        hx-target="#globalHtmxModalDialog"
        title="Toggle Watching Environment (LIVE / SANDBOX)">
    <span class="material-icons fs-6">{% if request.user.watching_on == 'LIVE' %}toggle_on{% else %}toggle_off{% endif %}</span>
    <span class="font-monospace">{% if request.user.watching_on == 'LIVE' %}LIVE{% else %}SANDBOX{% endif %}</span>
</button>
