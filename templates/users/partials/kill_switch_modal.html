<!-- templates/users/partials/kill_switch_modal.html -->
<div class="modal-content glass-card p-2 border-danger border-opacity-50">
    <div class="modal-header border-0 pb-2">
        <h5 class="modal-title text-danger fw-bold d-flex align-items-center gap-2">
            <span class="material-icons text-danger fs-4">bolt</span>
            Emergency Kill Switch Confirmation
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <form hx-post="{% url 'users:user-kill-switch' %}" hx-swap="none" class="modal-body pt-1">
        {% csrf_token %}
        <div class="p-3 mb-3 rounded-3 bg-danger bg-opacity-10 border border-danger border-opacity-25">
            <div class="d-flex align-items-start gap-2">
                <span class="material-icons text-danger mt-1">warning</span>
                <div>
                    <h6 class="fw-bold text-danger mb-1">CRITICAL SYSTEM ACTION</h6>
                    <p class="theme-text-muted small mb-0">
                        Activating the Emergency Kill Switch will immediately freeze all trading activity for account 
                        <strong class="theme-text-main">@{{ request.user.username }}</strong>. Primary Freeze and Final Freeze flags will be activated instantly.
                    </p>
                </div>
            </div>
        </div>

        <div class="modal-footer border-0 px-0 pb-0 pt-2 d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-danger rounded-pill px-4 fw-bold shadow">
                <span class="material-icons align-middle fs-6 me-1">bolt</span>
                ACTIVATE KILL SWITCH
            </button>
        </div>
    </form>
</div>
