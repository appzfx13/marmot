<!-- templates/users/partials/sandbox_settings_content.html -->
<div class="user-sandbox-viewport">
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
        <div>
            <h2 class="fw-bold theme-text-main mb-1 d-flex align-items-center gap-2">
                <span class="material-icons text-primary fs-3">tune</span>
                <span>Sandbox & Execution Settings</span>
            </h2>
            <p class="theme-text-muted small mb-0">Configure paper trading sandbox parameters and Risk/Reward parameters.</p>
        </div>
    </div>

    <!-- Sandbox Configuration Panel -->
    <div class="row g-4">
        <div class="col-12 col-lg-6">
            <div class="glass-card p-4 rounded-4 border" style="background: var(--glass-bg); border-color: var(--border-color) !important;">
                <h5 class="fw-bold theme-text-main mb-3 pb-2 border-bottom" style="border-color: var(--border-color) !important;">
                    Sandbox Account Profile
                </h5>

                <div class="d-flex flex-column gap-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="small theme-text-muted fw-bold">Environment</span>
                        <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 rounded-pill px-3 py-1 fw-bold">Sandbox Mode</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <span class="small theme-text-muted fw-bold">Auto-SL Engine</span>
                        <span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-25 rounded-pill px-3 py-1 fw-bold">Active</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <span class="small theme-text-muted fw-bold">Default Lot Size</span>
                        <span class="small theme-text-main fw-bold">1 Lot</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="glass-card p-4 rounded-4 border" style="background: var(--glass-bg); border-color: var(--border-color) !important;">
                <h5 class="fw-bold theme-text-main mb-3 pb-2 border-bottom" style="border-color: var(--border-color) !important;">
                    Account Security & Credentials
                </h5>

                <div class="d-flex flex-column gap-3">
                    <a href="{% url 'users:marmot-profile' %}" class="btn btn-outline-secondary d-flex align-items-center justify-content-between p-3 rounded-3 text-decoration-none">
                        <span class="fw-semibold">Edit Broker & API Key Profile</span>
                        <span class="material-icons fs-6">chevron_right</span>
                    </a>

                    <button type="button" 
                            class="btn btn-outline-warning d-flex align-items-center justify-content-between p-3 rounded-3 text-decoration-none"
                            hx-get="{% url 'users:marmot-profile-password' %}"
                            hx-target="#globalHtmxModalDialog">
                        <span class="fw-semibold">Change Account Password</span>
                        <span class="material-icons fs-6">security</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
