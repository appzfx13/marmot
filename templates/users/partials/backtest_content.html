<!-- templates/users/partials/backtest_content.html -->
<div class="user-backtest-viewport">
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
        <div>
            <h2 class="fw-bold theme-text-main mb-1 d-flex align-items-center gap-2">
                <span class="material-icons text-primary fs-3">science</span>
                <span>Strategy Backtesting</span>
            </h2>
            <p class="theme-text-muted small mb-0">Simulate market strategies, risk levels, and automated lot sizing rules.</p>
        </div>
        <a href="{% url 'admins:backtest_dashboard' %}" class="btn theme-btn-primary rounded-pill px-4 py-2 small fw-bold d-inline-flex align-items-center gap-2">
            <span class="material-icons fs-5">play_arrow</span>
            <span>Run New Simulation</span>
        </a>
    </div>

    <!-- Backtest Quick Stats -->
    <div class="row g-3 mb-4">
        <div class="col-12 col-md-4">
            <div class="glass-card p-3 rounded-4 border theme-text-main" style="background: var(--glass-bg); border-color: var(--border-color) !important;">
                <span class="small theme-text-muted text-uppercase fw-bold">Active Backtest Jobs</span>
                <h3 class="fw-bold mb-0 mt-1 theme-text-main">0</h3>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="glass-card p-3 rounded-4 border theme-text-main" style="background: var(--glass-bg); border-color: var(--border-color) !important;">
                <span class="small theme-text-muted text-uppercase fw-bold">Max Drawdown</span>
                <h3 class="fw-bold mb-0 mt-1 text-warning">0.00%</h3>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="glass-card p-3 rounded-4 border theme-text-main" style="background: var(--glass-bg); border-color: var(--border-color) !important;">
                <span class="small theme-text-muted text-uppercase fw-bold">Profit Factor</span>
                <h3 class="fw-bold mb-0 mt-1 text-success">0.00</h3>
            </div>
        </div>
    </div>

    <div class="glass-card p-4 rounded-4 border shadow-sm" style="background: var(--glass-bg); border-color: var(--border-color) !important;">
        <h5 class="fw-bold theme-text-main mb-3">Simulation Runs</h5>
        <div class="text-center py-5 theme-text-muted">
            <span class="material-icons fs-1 mb-2">science</span>
            <p class="mb-0">No active backtesting simulations available.</p>
        </div>
    </div>
</div>
