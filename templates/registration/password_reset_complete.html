{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password Reset Complete — Marmot Trading</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        :root[data-theme="dark"] {
            --bg-page: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-title: #f8fafc;
            --text-subtitle: #94a3b8;
            --text-muted: #64748b;
            --btn-primary: #3b82f6;
            --btn-primary-hover: #2563eb;
            --btn-text: #ffffff;
            --toggle-bg: rgba(255, 255, 255, 0.08);
            --toggle-border: rgba(255, 255, 255, 0.12);
        }

        :root[data-theme="light"] {
            --bg-page: #ffffff;
            --bg-card: #ffffff;
            --card-border: #e2e8f0;
            --text-title: #1e293b;
            --text-subtitle: #64748b;
            --text-muted: #94a3b8;
            --btn-primary: #2563eb;
            --btn-primary-hover: #1d4ed8;
            --btn-text: #ffffff;
            --toggle-bg: rgba(0, 0, 0, 0.05);
            --toggle-border: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 40px 14px;
            position: relative;
            transition: background-color 0.3s ease;
        }

        .auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 36px 30px;
            box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.25);
            text-align: center;
            animation: cardFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (max-width: 576px) {
            body {
                padding: 60px 14px 24px 14px;
            }
            .auth-card {
                padding: 24px 18px;
                border-radius: 20px;
            }
            .auth-title {
                font-size: 1.35rem !important;
            }
            .auth-subtitle {
                font-size: 0.8125rem !important;
                margin-bottom: 20px !important;
            }
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-title {
            color: var(--text-title);
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            color: var(--text-subtitle);
            font-size: 0.875rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-submit {
            background-color: var(--btn-primary);
            color: var(--btn-text);
            border: none;
            border-radius: 50px;
            padding: 11px 24px;
            font-size: 0.9375rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 44px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .btn-submit:hover {
            background-color: var(--btn-primary-hover);
            color: var(--btn-text);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="d-inline-flex align-items-center justify-content-center mb-3 p-3 rounded-circle" style="background: rgba(34, 197, 94, 0.12); color: #22c55e;">
            <span class="material-icons" style="font-size: 40px;">check_circle</span>
        </div>
        <h1 class="auth-title">Password Reset Complete</h1>
        <p class="auth-subtitle">
            Your new password has been set successfully. You may now log in to the trading terminal.
        </p>

        <a href="{% url 'users:marmot-login' %}" class="btn btn-submit">
            <span>Sign In to Terminal</span>
            <span class="material-icons" style="font-size: 18px;">arrow_forward</span>
        </a>
    </div>

    <script>
        (function() {
            const htmlElement = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            htmlElement.setAttribute('data-theme', savedTheme || (systemPrefersDark ? 'dark' : 'light'));
        })();
    </script>
</body>
</html>
