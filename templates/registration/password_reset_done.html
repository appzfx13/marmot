{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instructions Sent — Marmot Trading</title>

    <!-- Bootstrap 5 CSS & Google Fonts/Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,400..700;1,400..700&family=Google+Sans+Flex:opsz,slnt,wdth,wght,ROND@8..144,-10..0,25..150,400..700,0..100&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Symbols:opsz,wght,FILL,GRAD,ROND@20..48,100..700,0..1,-50..200,0..100&display=block" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        :root[data-theme="dark"] {
            --bg-page: #000000;
            --bg-card: rgba(13, 18, 30, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-title: #ffffff;
            --text-subtitle: rgba(255, 255, 255, 0.72);
            --text-muted: rgba(255, 255, 255, 0.45);
            --btn-primary: #7a5af8;
            --btn-primary-hover: #6342e8;
            --btn-text: #ffffff;
            --toggle-bg: rgba(255, 255, 255, 0.08);
            --toggle-border: rgba(255, 255, 255, 0.12);
            --aurora-1: rgba(122, 90, 248, 0.20);
            --aurora-2: rgba(26, 115, 232, 0.15);
        }

        :root[data-theme="light"] {
            --bg-page: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.92);
            --card-border: rgba(15, 23, 42, 0.08);
            --text-title: #0f172a;
            --text-subtitle: #475569;
            --text-muted: #64748b;
            --btn-primary: #7a5af8;
            --btn-primary-hover: #6342e8;
            --btn-text: #ffffff;
            --toggle-bg: rgba(0, 0, 0, 0.05);
            --toggle-border: rgba(0, 0, 0, 0.1);
            --aurora-1: rgba(122, 90, 248, 0.08);
            --aurora-2: rgba(26, 115, 232, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Google Sans Flex', 'Google Sans', -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(circle at 50% 15%, var(--aurora-1) 0%, transparent 55%),
                radial-gradient(circle at 80% 40%, var(--aurora-2) 0%, transparent 45%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 40px 14px;
            position: relative;
            letter-spacing: -0.01em;
            transition: background-color 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ambient-blob-container {
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            pointer-events: none;
            opacity: 0.7;
            max-width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .ambient-blob-container svg {
            max-width: 100vw;
            width: 700px;
            height: auto;
        }

        .auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 36px 30px;
            box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.25);
            text-align: center;
            animation: cardFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (max-width: 576px) {
            body {
                padding: 60px 14px 24px 14px;
            }
            .auth-card {
                padding: 24px 18px;
                border-radius: 20px;
            }
            .auth-title {
                font-size: 1.35rem !important;
            }
            .auth-subtitle {
                font-size: 0.8125rem !important;
                margin-bottom: 20px !important;
            }
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-title {
            color: var(--text-title);
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            color: var(--text-subtitle);
            font-size: 0.875rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-submit {
            background-color: var(--btn-primary);
            color: var(--btn-text);
            border: none;
            border-radius: 50px;
            padding: 11px 24px;
            font-size: 0.9375rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 44px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .auth-nav-top {
            position: fixed;
            top: 14px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            max-width: 100%;
            pointer-events: none;
        }

        .auth-nav-btn {
            background: var(--toggle-bg);
            border: 1px solid var(--toggle-border);
            color: var(--text-title);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 50px;
            padding: 7px 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            font-size: 0.8125rem;
            font-weight: 600;
            transition: all 0.2s ease;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .auth-nav-btn:hover {
            color: var(--text-title);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <!-- Fixed Header: Back to Home & Dark/Light Toggle -->
    <div class="auth-nav-top">
        <a href="{% url 'home' %}" class="auth-nav-btn" title="Back to Home">
            <span class="material-icons" style="font-size: 16px;">arrow_back</span>
            <span>Back</span>
        </a>
        <button id="themeToggleBtn" class="auth-nav-btn" type="button" title="Toggle color theme">
            <span class="material-icons" id="themeIcon" style="font-size: 16px;">light_mode</span>
            <span id="themeText">Light</span>
        </button>
    </div>

    <div class="auth-card">
        <div class="d-inline-flex align-items-center justify-content-center mb-3 p-3 rounded-circle" style="background: rgba(34, 197, 94, 0.12); color: #22c55e;">
            <span class="material-icons" style="font-size: 40px;">mark_email_read</span>
        </div>
        <h1 class="auth-title">Check Your Email</h1>
        <p class="auth-subtitle">
            If an account exists with the provided address, we’ve dispatched an email with instructions on how to reset your password.
        </p>

        <a href="{% url 'users:marmot-login' %}" class="btn btn-submit">
            <span class="material-icons" style="font-size: 18px;">arrow_back</span>
            <span>Return to Sign In</span>
        </a>
    </div>

    <div class="ambient-blob-container">
        <svg width="930" height="760" viewBox="0 0 930 760" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g opacity="0.35" filter="url(#filter0_f_blob)">
                <circle cx="380.335" cy="380.335" r="179.665" fill="#FF58D5" />
            </g>
            <g opacity="0.65" filter="url(#filter1_f_blob)">
                <circle cx="549.665" cy="380.335" r="179.665" fill="#4E6EFF" />
            </g>
            <defs>
                <filter id="filter0_f_blob" x="0.67" y="0.67" width="759.33" height="759.33" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
                    <feFlood flood-opacity="0" result="BackgroundImageFix" />
                    <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
                    <feGaussianBlur stdDeviation="100" result="effect1_foregroundBlur" />
                </filter>
                <filter id="filter1_f_blob" x="170" y="0.67" width="759.33" height="759.33" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
                    <feFlood flood-opacity="0" result="BackgroundImageFix" />
                    <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
                    <feGaussianBlur stdDeviation="100" result="effect1_foregroundBlur" />
                </filter>
            </defs>
        </svg>
    </div>

    <script>
        (function() {
            const htmlElement = document.documentElement;
            const themeBtn = document.getElementById('themeToggleBtn');
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');

            function applyTheme(theme) {
                htmlElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                if (theme === 'dark') {
                    if (themeIcon) themeIcon.textContent = 'light_mode';
                    if (themeText) themeText.textContent = 'Light';
                } else {
                    if (themeIcon) themeIcon.textContent = 'dark_mode';
                    if (themeText) themeText.textContent = 'Dark';
                }
            }

            const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            applyTheme(savedTheme);

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    const currentTheme = htmlElement.getAttribute('data-theme');
                    applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
                });
            }
        })();
    </script>
</body>
</html>
