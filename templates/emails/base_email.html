<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Marmot Trading Platform{% endblock %}</title>
    <style>
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        body { margin: 0; padding: 0; width: 100% !important; background-color: #05070e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #ffffff; }
        .email-wrapper { width: 100%; background-color: #05070e; padding: 32px 12px; }
        .email-card { max-width: 580px; margin: 0 auto; background: #0c101d; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .email-header { padding: 28px 32px; background: radial-gradient(circle at 50% 0%, rgba(122, 90, 248, 0.25) 0%, transparent 70%), #0c101d; border-bottom: 1px solid rgba(255, 255, 255, 0.08); text-align: center; }
        .email-logo { font-size: 20px; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; text-decoration: none; }
        .email-logo span { color: #7a5af8; }
        .email-body { padding: 32px; font-size: 15px; line-height: 1.6; color: rgba(255, 255, 255, 0.85); }
        .email-btn { display: inline-block; background-color: #7a5af8; color: #ffffff !important; text-decoration: none; padding: 12px 28px; border-radius: 50px; font-weight: 600; font-size: 14px; margin: 20px 0; text-align: center; }
        .email-footer { padding: 24px 32px; background-color: #080b14; border-top: 1px solid rgba(255, 255, 255, 0.06); text-align: center; font-size: 12px; color: rgba(255, 255, 255, 0.45); line-height: 1.5; }
        .email-footer a { color: #7a5af8; text-decoration: none; }
        .badge-pill { display: inline-block; padding: 4px 12px; border-radius: 50px; font-size: 12px; font-weight: 700; background: rgba(122, 90, 248, 0.15); color: #9b8afb; border: 1px solid rgba(122, 90, 248, 0.3); }
        .data-table { width: 100%; border-collapse: collapse; margin: 16px 0; background: rgba(255, 255, 255, 0.02); border-radius: 12px; overflow: hidden; }
        .data-table td { padding: 10px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); font-size: 13px; }
        .data-table td.label { color: rgba(255, 255, 255, 0.5); width: 40%; }
        .data-table td.val { color: #ffffff; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
            <tr>
                <td align="center">
                    <div class="email-card">
                        <!-- Header -->
                        <div class="email-header">
                            <a href="{{ site_url|default:'#' }}" class="email-logo">
                                MARMOT <span>TRADING</span>
                            </a>
                        </div>

                        <!-- Content Area -->
                        <div class="email-body">
                            {% block content %}{% endblock %}
                        </div>

                        <!-- Footer -->
                        <div class="email-footer">
                            <p style="margin: 0 0 8px 0;">Marmot Algorithmic & High-Frequency Trading Terminal</p>
                            <p style="margin: 0 0 8px 0;">Automated notification sent via Marmot Core Engine. Please do not reply directly to this email.</p>
                            <p style="margin: 0;">&copy; {{ current_year|default:'2026' }} Marmot Platform. All rights reserved.</p>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
